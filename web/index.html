<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calculadora CDI/SELIC Pro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="app.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

</head>
<body>

<button class="theme-toggle" id="theme-toggle">🌙</button>

<div class="container">
  <h1>Calculadora CDI / SELIC</h1>

  <form id="form">
    <div class="row">
      <fieldset>
        <legend>Parâmetros</legend>
        <label>Taxa Anual (%)</label>
        <input id="cdi" type="number" step="0.01" value="11.75" required />
        <label>Percentual do CDI (%)</label>
        <input id="percentual" type="number" step="0.01" value="100" required />
        <label>Vencimento (DD/MM/AAAA)</label>
        <input id="future" type="text" placeholder="Ex: 10/10/2026" />
        <label>Prazo (Meses)</label>
        <input id="prazo" type="number" min="0" />
      </fieldset>
      <fieldset>
        <legend>Investimento</legend>
        <label>Inicial (R$)</label>
        <input id="inicial" type="number" step="0.01" required />
        <label>Aporte Mensal (R$)</label>
        <input id="aporte" type="number" step="0.01" value="0" />
        <label style="display: flex; align-items: center; gap: 8px; margin-top: 10px;">
          <input id="inicio" type="checkbox" checked style="width: auto; margin: 0;"> Aporte no início
        </label>
      </fieldset>
    </div>
    <div style="text-align: center;">
      <button type="submit">Calcular Rendimentos</button>
      <div id="error"></div>
    </div>
  </form>

  <div class="result" id="result" hidden>
    <div class="summary" id="summary"></div>

    <div class="table-container">
      <table id="tabela">
        <thead>
        <tr>
          <th class="text-center">Mês</th>
          <th>Saldo Inicial</th>
          <th>Aporte</th>
          <th>Rend. Bruto</th>
          <th>IRPF</th>
          <th>Saldo Líquido</th>
        </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="btn-group">
      <button onclick="exportPDF()" class="btn-secondary">Exportar PDF</button>
      <button onclick="exportCSV()" class="btn-secondary">Exportar CSV</button>
    </div>
  </div>
</div>

<script defer src="app.js"></script>
</body>
</html>
