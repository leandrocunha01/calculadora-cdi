<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calculadora CDI/SELIC</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; }
    fieldset { border: 1px solid #ccc; padding: 16px; margin-bottom: 16px; }
    label { display: block; margin: 8px 0 4px; }
    input[type="number"], input[type="text"] { width: 240px; padding: 6px; }
    .row { display: flex; gap: 24px; flex-wrap: wrap; }
    button { padding: 8px 16px; }
    .result { margin-top: 24px; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: right; }
    th:nth-child(1), td:nth-child(1) { text-align: center; }
    th { background: #f4f4f4; position: sticky; top: 0; }
    .summary { margin: 16px 0; }
    .error { color: #b00020; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Calculadora CDI/SELIC (Web)</h1>

  <form id="form">
    <div class="row">
      <fieldset>
        <legend>Parâmetros de Taxa e Prazo</legend>
        <label for="cdi">CDI/SELIC anual (%)</label>
        <input id="cdi" type="number" step="0.01" placeholder="ex: 13.65" required />

        <label for="percentual">Percentual do CDI/SELIC (%)</label>
        <input id="percentual" type="number" step="0.01" placeholder="ex: 100" value="100" required />

        <label for="future">Data futura (DD/MM/AAAA)</label>
        <input id="future" type="text" placeholder="ex: 15/12/2027" />

        <label for="prazo">Prazo (meses) — deixe vazio se informou a data</label>
        <input id="prazo" type="number" min="0" step="1" />
      </fieldset>

      <fieldset>
        <legend>Valores</legend>
        <label for="inicial">Valor inicial (R$)</label>
        <input id="inicial" type="number" step="0.01" placeholder="ex: 10000" required />

        <label for="aporte">Aporte mensal (R$)</label>
        <input id="aporte" type="number" step="0.01" placeholder="ex: 500" required />

        <label>
          <input id="inicio" type="checkbox" checked /> Aporte no início do mês
        </label>
      </fieldset>
    </div>

    <button type="submit">Calcular</button>
    <span id="status"></span>
    <div class="error" id="error"></div>
  </form>

  <div class="result" id="result" hidden>
    <div class="summary" id="summary"></div>
    <div>
      <table id="tabela">
        <thead>
          <tr>
            <th>Mês</th>
            <th>Saldo Inicial</th>
            <th>Aporte</th>
            <th>Rendimento</th>
            <th>IRPF Mês</th>
            <th>Rend. Líquido</th>
            <th>Saldo Líquido</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    function brl(n) {
      return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('status');
      const err = document.getElementById('error');
      const result = document.getElementById('result');
      const tbody = document.querySelector('#tabela tbody');
      const summary = document.getElementById('summary');
      status.textContent = 'Calculando...';
      err.textContent = '';
      result.hidden = true;
      tbody.innerHTML = '';
      summary.textContent = '';

      const payload = {
        futureDate: document.getElementById('future').value.trim(),
        prazoMeses: parseInt(document.getElementById('prazo').value, 10) || 0,
        cdiAnual: parseFloat(document.getElementById('cdi').value),
        percentualCdi: parseFloat(document.getElementById('percentual').value),
        valorInicial: parseFloat(document.getElementById('inicial').value),
        aporteMensal: parseFloat(document.getElementById('aporte').value),
        aporteNoInicio: document.getElementById('inicio').checked,
      };

      try {
        const res = await fetch('/simulate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.erro || 'Falha ao calcular');
        }

        // Summary
        summary.innerHTML = `
          <div><strong>Meses:</strong> ${data.meses} | <strong>Alíquota IRPF:</strong> ${data.aliquotaIrpf.toFixed(1)}%</div>
          <div><strong>Total investido:</strong> ${brl(data.totalInvestido)} | 
               <strong>Rendimentos brutos:</strong> ${brl(data.totalJurosBruto)} | 
               <strong>Total IRPF:</strong> ${brl(data.totalIrpf)}</div>
          <div><strong>Resultado líquido:</strong> ${brl(data.resultadoLiquido)} | 
               <strong>Saldo final bruto:</strong> ${brl(data.saldoFinalBruto)}</div>
        `;

        // Rows
        let saldoAcumulado = payload.valorInicial;
        for (const m of data.evolucao) {
          const irMes = m.rendimento * (data.aliquotaIrpf / 100);
          const jurosLiquido = m.rendimento - irMes;
          let saldoFinal = saldoAcumulado;
          if (payload.aporteNoInicio) saldoFinal += m.aporte;
          saldoFinal += jurosLiquido;
          if (!payload.aporteNoInicio) saldoFinal += m.aporte;

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td style="text-align:center;">${m.mes}</td>
            <td>${brl(m.saldoInicial)}</td>
            <td>${brl(m.aporte)}</td>
            <td>${brl(m.rendimento)}</td>
            <td>${brl(irMes)}</td>
            <td>${brl(jurosLiquido)}</td>
            <td>${brl(saldoFinal)}</td>
          `;
          tbody.appendChild(tr);
          saldoAcumulado = saldoFinal;
        }

        result.hidden = false;
      } catch (ex) {
        err.textContent = ex.message;
      } finally {
        status.textContent = '';
      }
    });
  </script>
</body>
</html>
